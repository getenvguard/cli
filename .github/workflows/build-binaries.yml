name: Build & Release Go Native CLI Binaries

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'

jobs:
  build:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/envg-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/envg-linux-arm64 main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/envg-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/envg-darwin-arm64 main.go
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/envg-windows-amd64.exe main.go

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: envg-binaries
          path: dist/*
